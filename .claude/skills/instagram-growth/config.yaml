# Founder-tunable knobs for the TrendRadar Instagram growth strategy.
# Edit values here to change behavior — do not hardcode these elsewhere.
# The weekly-routine skill reads this file at generation time.

cadence:
  # 2026-08-28 (Group CTO, on explicit founder delegation -- see
  # income-engine/docs/consults/2026-08-28-group-cto-instagram-cadence-execution.md):
  # signal days come back down 5 -> 3. The measured sustained eligible pool is
  # ~6 distinct entities per 2-week no-repeat window (CCO measurement,
  # 2026-08-28), which arithmetically supports at most 3 signal posts/week --
  # the 2026-08-25 Tue/Thu additions asked for 10/window against a pool of 6.
  # Each signal slot is also gated at generation time (family-aware freshness,
  # see instagram-signals) and falls back to a `no_signal` post when nothing
  # is eligible -- a slot never fabricates and never silently vanishes.
  # RATCHET: restore tuesday/thursday to `signal` only when the measured
  # eligible pool sustains >=10 distinct entities per 2-week window; daily
  # posting can alternatively return via non-signal content types under the
  # still-pending founder content-mix decision
  # (income-engine/docs/consults/2026-08-25-instagram-cadence-content-mix-options.md).
  posts_per_week: 5
  generation_every_days: 2   # generation cadence (founder decision 2026-08-28); a *check* frequency, not a post quota
  schedule:
    monday: signal
    tuesday: none        # was signal 2026-08-25..28; see ratchet note above
    wednesday: signal
    thursday: none       # was signal 2026-08-25..28; see ratchet note above
    friday: signal
    saturday: digest
    sunday: build_in_public
  posting_time_ist: "20:00"  # evening IST default (see references/algorithm.md §5) — switch to
                              # the account's own Insights "most active times" once ~2 weeks of data exist

tone:
  aggressiveness: medium      # low | medium | high — how bold/curiosity-gap-forward hooks are
  hype_tolerance: none         # none | low — "receipts not hype" brand; keep at none unless founder changes it

content_mix:
  forward_dated_predictions: false   # gate stays closed until trend_predictor's lead time is privately validated
  trend_jacking: true                # ok to react fast to breaking trends, subject to the honesty rules in SKILL.md
  max_hashtags: 5

format:
  slides_per_carousel_min: 5
  slides_per_carousel_max: 7
  reels: false                       # revisit once the static carousel pipeline has run reliably for several weeks

future_work:
  performance_feedback_loop: false   # explicitly not built — founder said "not now" (2026-08-17)
