name: Refresh Instagram token

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      # META_APP_ID / META_APP_SECRET are only read when IG_AUTH_MODE is
      # facebook_login; empty is fine (and expected) under instagram_login.
      - run: python scripts/refresh_token.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          IG_AUTH_MODE: ${{ vars.IG_AUTH_MODE || 'instagram_login' }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GITHUB_REPOSITORY: ${{ github.repository }}
